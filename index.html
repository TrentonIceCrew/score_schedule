<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ironhawks Home Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy rink-board header with red/blue line markings, a featured "next game" faceoff block, then month-grouped game rows */
:root{
  --navy:#0d2449; --navy-2:#163668; --red:#c8102e; --red-hi:#e0213f; --steel:#8b97a8; --ice:#eef2f7;
  --bg:#eef2f7; --surface:#ffffff; --ink:#0d1b33; --muted:#566377; --line:#d3dae4;
  --chip:#e2e8f1; --date-bg:#0d2449; --date-ink:#ffffff;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081428; --surface:#0f203d; --ink:#eaf0f8; --muted:#9aa8bc; --line:#1f3457;
  --chip:#1a2e50; --date-bg:#c8102e; --date-ink:#ffffff; --red-hi:#ff3150; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081428; --surface:#0f203d; --ink:#eaf0f8; --muted:#9aa8bc; --line:#1f3457;
  --chip:#1a2e50; --date-bg:#c8102e; --date-ink:#ffffff; --red-hi:#ff3150; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header: rink boards. Red center line, blue lines, faceoff circle */
header{position:relative;overflow:hidden;color:#fff;background:
  radial-gradient(circle at 88% 50%, transparent 0 118px, rgba(200,16,46,.55) 119px 123px, transparent 124px),
  radial-gradient(circle at 88% 50%, rgba(200,16,46,.6) 0 7px, transparent 8px),
  linear-gradient(90deg, transparent 0 62%, rgba(255,255,255,.07) 62% 64%, transparent 64%),
  linear-gradient(160deg,var(--navy-2),var(--navy) 70%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--red) 0 33.3%,#fff 33.3% 36%,var(--steel) 36% 64%,#fff 64% 66.7%,var(--red) 66.7%)}
header .wrap{position:relative;padding-block:34px 40px;display:grid;gap:12px}
.season{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#c9d3e2}
.season b{background:var(--red);color:#fff;padding:3px 8px;letter-spacing:.12em;transform:skewX(-10deg);display:inline-block}
h1{margin:0;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.88;letter-spacing:.005em;font-size:clamp(46px,10vw,88px);text-wrap:balance}
h1 .red{color:var(--red-hi);display:block}
.venue{margin:4px 0 0;color:#c9d3e2;font-weight:500}
.venue strong{color:#fff;font-weight:700}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 14px/1 var(--body);letter-spacing:.02em;padding:11px 14px;border-radius:4px;text-decoration:none;border:2px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--red-hi);outline-offset:2px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn.on-dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.on-dark:hover{border-color:#fff}
.btn[disabled]{opacity:.6;cursor:progress}

/* Next game feature */
.next{margin-top:-18px;position:relative;z-index:1;background:var(--surface);border:2px solid var(--navy);border-radius:6px;display:grid;grid-template-columns:auto 1fr;overflow:hidden}
.next .tag{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--red);color:#fff;font-family:var(--display);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px;padding:14px 8px;text-align:center}
.next .body{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.next .when{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-hi)}
.next .who{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(28px,5vw,38px);line-height:1;text-transform:uppercase}
.next .who small{font-style:normal;font-weight:700;font-size:.55em;color:var(--muted);margin-right:6px}
.next .info{min-width:0}

.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:24px 0}
.count{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:16px}
.count span{color:var(--red-hi)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.toggle input{accent-color:var(--red);width:18px;height:18px}

main{padding-bottom:40px}
.month{margin-top:28px}
.month h2{margin:0 0 12px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:900;font-style:italic;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.month h2::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--red) 0 48px,var(--line) 48px)}
.month h2 span{font-style:normal;font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.08em}
.games{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.game{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 10px}
.date{background:var(--date-bg);color:var(--date-ink);border-radius:4px;text-align:center;padding:8px 4px 7px;font-family:var(--display);line-height:1}
.date .dow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.date .day{font-weight:900;font-style:italic;font-size:32px;margin-top:2px;font-variant-numeric:tabular-nums}
.info{min-width:0}
.opp{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.opp small{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-transform:none;margin-right:5px}
.meta{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta .time{color:var(--ink);font-weight:700}
.pill{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--chip);color:var(--ink)}
.pill.win{background:var(--red);color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.game.past{opacity:.62}
.game.past .actions{display:none}
.game.is-next{border-color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--red);padding:12px 16px;border-radius:4px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}

footer{color:var(--muted);font-size:13px;padding-block:6px 32px;border-top:1px solid var(--line)}
footer p{margin:12px 0 0;max-width:68ch}
footer a{color:inherit}

@media (max-width:640px){
  header{background:
    radial-gradient(circle at 100% 30%, transparent 0 90px, rgba(200,16,46,.5) 91px 94px, transparent 95px),
    linear-gradient(160deg,var(--navy-2),var(--navy) 70%)}
  .game{grid-template-columns:58px 1fr;gap:12px}
  .actions{grid-column:1 / -1}
  .actions .btn{flex:1 1 0}
  .date .day{font-size:28px}
  .next .body{padding:14px}
  .next .body .actions{width:100%}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,background .15s}}
</style>

</head><body>
<header>
  <div class="wrap">
    <div class="season"><b>2026–27</b> Home schedule</div>
    <h1>Trenton <span class="red">Ironhawks</span></h1>

    <div class="actions" style="justify-content:flex-start;margin-top:6px">
      <button class="btn red" type="button" id="allIcal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>Add all home games to iCal</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="nextSlot"></div>
  <div class="controls">
    <div class="count" id="count"></div>
    <label class="toggle" for="showPast"><input type="checkbox" id="showPast"> Show past games</label>
  </div>
  <div id="schedule"></div>
</main>

<footer class="wrap">

  <p>Google adds the game to Google Calendar in one click. Each game is blocked out for 2½ hours. Schedule from <a href="https://trentonironhawks.com/ironhawks-schedule" target="_blank" rel="noopener">trentonironhawks.com</a>. Check there for changes.</p>
</footer>
<div class="toast" id="toast" hidden></div>

const LOC = "CURE Insurance Arena, 10 Hamilton Avenue, Trenton, NJ 08611";
const RESULTS = {"2026-10-24":"W 4–1"};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ICON_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>';

function parts(s){return {y:+s.slice(0,4),m:+s.slice(4,6)-1,d:+s.slice(6,8),h:+s.slice(9,11),min:+s.slice(11,13)}}
function timeStr(p){const h=p.h%12||12;return h+":"+String(p.min).padStart(2,"0")+(p.h<12?" AM":" PM")}
function todayKey(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function gcal(g){
  const q=new URLSearchParams({action:"TEMPLATE",text:"Ironhawks vs. "+g.full,dates:g.start+"/"+g.end,ctz:"America/New_York",location:LOC,details:"Trenton Ironhawks home game at CURE Insurance Arena."});

let toastTimer;

let downloadsP=null;
if(MODE==="artifact"&&window.claude&&window.claude.use){downloadsP=window.claude.use("downloads")}
async function addIcal(list,base,btn){
  const text=icsText(list);
  if(MODE==="file"){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"text/calendar"}));a.download=base+".ics";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);

function gameActions(g){
  return '<div class="actions">'
    +'<a class="btn" href="'+gcal(g)+'" target="_blank" rel="noopener">'+ICON_G+'Google</a>'
    +'<button class="btn red" type="button" data-ical="'+g.id+'">'+ICON_CAL+'iCal</button>'
    +'</div>';
}
function render(){
  const showPast=document.getElementById("showPast").checked;
  const today=todayKey();
  const upcoming=GAMES.filter(g=>g.id>=today);
  const list=showPast?GAMES:upcoming;
  const next=upcoming[0];
  document.getElementById("count").innerHTML='<span>'+upcoming.length+'</span> home games left · '+GAMES.length+' this season';
  // Next game feature
  const slot=document.getElementById("nextSlot");
  if(next){
    const p=parts(next.start);const dow=new Date(p.y,p.m,p.d).toLocaleDateString("en-US",{weekday:"long"});
    slot.innerHTML='<section class="next" aria-label="Next home game"><div class="tag">Next game</div><div class="body"><div class="info">'
      +'<div class="when">'+dow+', '+MONTHS[p.m]+' '+p.d+' · '+timeStr(p)+'</div>'
      +'<div class="who"><small>vs.</small>'+next.full+'</div></div>'+gameActions(next)+'</div></section>';
  }else slot.innerHTML="";
  const byMonth=new Map();
  for(const g of list){const p=parts(g.start);const k=p.y+"-"+p.m;if(!byMonth.has(k))byMonth.set(k,{p,games:[]});byMonth.get(k).games.push(g)}
  let html="";
  for(const {p,games} of byMonth.values()){
    html+='<section class="month"><h2>'+MONTHS[p.m]+' <span>'+p.y+' · '+games.length+(games.length===1?' game':' games')+'</span></h2><ul class="games">';
    for(const g of games){
      const q=parts(g.start);const dow=DOW[new Date(q.y,q.m,q.d).getDay()];
      const past=g.id<today;
      const res=past&&RESULTS[g.id]?'<span class="pill win">'+RESULTS[g.id]+'</span>':(past?'<span class="pill">Final</span>':'');
      html+='<li class="game'+(past?' past':'')+(next&&g.id===next.id?' is-next':'')+'">'
        +'<div class="date"><div class="dow">'+dow+'</div><div class="day">'+q.d+'</div></div>'
        +'<div class="info"><div class="opp"><small>vs.</small>'+g.full+'</div>'
        +'<div class="meta"><span>'+MONTHS[q.m].slice(0,3)+' '+q.d+'</span><span class="time">'+timeStr(q)+'</span>'+res+'</div></div>'
        +(past?'':gameActions(g))+'</li>';
    }
    html+='</ul></section>';
  }
  document.getElementById("schedule").innerHTML=html;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ical]");if(!b)return;
  const g=GAMES.find(x=>x.id===b.dataset.ical);
  addIcal([g],"ironhawks-vs-"+g.short.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]+/g,"-")+"-"+g.id,b);
});
document.getElementById("allIcal").addEventListener("click",e=>{
  addIcal(GAMES.filter(g=>g.id>=todayKey()),"ironhawks-home-games",e.currentTarget);
});
document.getElementById("icalHelp").textContent = MODE==="file"
  ? "iCal downloads a calendar file. Open it to add the game to Apple Calendar or Outlook."
  : "iCal saves a small .zip with the calendar file inside. Open the .zip, then open the .ics file to add the game to Apple Calendar or Outlook.";
const cb=document.getElementById("showPast");
try{cb.checked=localStorage.getItem("showPast")==="1"}catch(e){}
cb.addEventListener("change",()=>{try{localStorage.setItem("showPast",cb.checked?"1":"0")}catch(e){}render()});
render();
</script>
